<h3>Komentarze {{consultationId}}</h3>

<div class="comments-container" *ngIf="comments?.length; else noComments">
  <div class="comment-card" *ngFor="let c of comments">
    
    <p class="comment-question">Pytanie #{{ c.question }}</p>

    <p class="comment-text">"{{ c.comment_text }}"</p>
    <p class="comment-author">— {{ c.author }}</p>
  </div>
</div>

<ng-template #noComments>
  <p class="no-comments">Brak komentarzy do wyświetlenia.</p>
</ng-template>
