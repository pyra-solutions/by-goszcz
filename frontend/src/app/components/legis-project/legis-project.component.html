
<div class="legis-project">
	<div class="legis-project__meta" [ngClass]="selected ? 'legis-project.is-selected' : ''">
		<h3>{{name}}</h3>
		<p>{{source}}</p>
	</div>
	<div class="legis-project__status">
		<span class="gov-tag" [ngClass]="'gov-tag--' + status">{{status}}</span>
		<span class="legis-project__step">{{step}}</span>
	</div>
</div>
