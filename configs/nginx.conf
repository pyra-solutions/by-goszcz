user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main 'remote_addr=$remote_addr '
    	    'remote_user=$remote_user '
    	    'time_local=$time_local '
    	    'request="$request" '
    	    'status=$status '
    	    'body_bytes_sent=$body_bytes_sent '
    	    'http_referer="$http_referer" '
    	    'http_user_agent="$http_user_agent" '
    	    'http_x_forwarded_for="$http_x_forwarded_for" '
    	    'request_time=$request_time '
    	    'upstream_response_time=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;


    server {
        listen 443 ssl;
        server_name pyra-solutions.dedyn.io;

        # ssl_certificate /certs/cloudflare.crt;
        # ssl_certificate_key /certs/cloudflare.key;
        ssl_certificate /etc/letsencrypt/live/pyra-solutions.dedyn.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pyra-solutions.dedyn.io/privkey.pem;

        location /acts {
	    rewrite ^/acts/(.*)$ /$1 break;
            root /acts/;
        }

        set $upstream_host backend;
        location /api {
	    rewrite ^/api/(.*)$ /$1 break;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            resolver 127.0.0.11 valid=10s;  # Use Docker DNS resolver
            proxy_pass http://$upstream_host:8000;
        }

        root /usr/share/nginx/html;

    }


    server {
        listen 80;
        server_name pyra-solutions.dedyn.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

